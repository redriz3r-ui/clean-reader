<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clean Reader & Moodboard</title>
  <style>
    :root { color-scheme:light dark; --paper:#fff; --ink:#20201d; --muted:#6c6c65; --accent:#306b48; --line:#deded6; --bg:#f3f1eb; }
    @media(prefers-color-scheme:dark){:root{--paper:#1d1e1b;--ink:#ecece5;--muted:#aaa99f;--accent:#82c99c;--line:#3b3c36;--bg:#121310}}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 Georgia,serif}
    header,main{width:min(1100px,calc(100% - 32px));margin:auto} header{padding:48px 0 24px} h1{margin:0 0 6px;font:700 32px/1.2 system-ui,sans-serif}
    .intro,.meta,.status{color:var(--muted);font-family:system-ui,sans-serif} form{display:flex;gap:8px;margin-top:24px}
    input,textarea{border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);font:16px system-ui,sans-serif}
    form input{flex:1;min-width:0;padding:13px 15px} button,.file-button{border:0;border-radius:9px;padding:12px 17px;background:var(--accent);color:var(--paper);font:600 15px system-ui,sans-serif;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}.status{min-height:26px;margin:10px 0;font-size:14px}.local-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    .file-button{display:inline-flex;align-items:center;background:var(--paper);border:1px solid var(--line);color:var(--ink)}.file-button input{position:absolute;opacity:0;pointer-events:none;width:1px}
    article,.moodboard{background:var(--paper);padding:clamp(24px,6vw,60px);border:1px solid var(--line);border-radius:12px;margin:12px 0 60px;overflow-wrap:anywhere}
    article[hidden],.moodboard[hidden],.download-panel[hidden]{display:none}article h2{font-size:clamp(28px,6vw,44px);line-height:1.15;margin:0 0 10px}article img{max-width:100%;height:auto}
    #content>:not(.image-gallery){max-width:720px;margin-left:auto;margin-right:auto}.image-gallery,.mood-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;margin-top:28px}
    .gallery-item,.mood-card{position:relative;margin:0;background:var(--bg);border-radius:8px;overflow:hidden;break-inside:avoid}.gallery-item a{display:block}.gallery-item img{display:block;width:100%;height:auto}article a{color:var(--accent)}
    .tools{display:flex;gap:8px;margin:22px 0}.tools button,.remove-image{color:var(--ink);background:transparent;border:1px solid var(--line)}.download-panel{margin:18px 0;padding:14px;border:1px solid var(--line);border-radius:9px;font:14px/1.5 system-ui,sans-serif}.download-panel label{display:block;margin:8px 0}
    .image-select{position:absolute;z-index:2;top:10px;left:10px;width:22px;height:22px;accent-color:var(--accent)}.moodboard-head{display:flex;align-items:center;gap:12px}.moodboard-head input{width:100%;padding:10px;font-size:24px;font-weight:700}.mood-card img{display:block;width:100%;height:230px;object-fit:cover}
    .mood-fields{padding:12px}.mood-fields input,.mood-fields textarea{display:block;width:100%;margin-bottom:8px;padding:8px 10px;font-size:14px}.mood-fields textarea{resize:vertical;min-height:64px}.remove-image{padding:7px 10px}
    @media(max-width:560px){form{flex-direction:column}header{padding-top:28px}}
    @media print{header,article,.remove-image{display:none!important}body{background:#fff;color:#111}.moodboard{border:0;padding:0}.mood-card{background:#f3f3f3}.mood-fields input,.mood-fields textarea{border:0;background:transparent;resize:none}}
  </style>
</head>
<body>
  <header>
    <h1>Clean Reader & Moodboard</h1>
    <div class="intro">Clean a permitted public webpage, or organize local reference images without an API.</div>
    <form id="reader-form"><input id="url" type="url" required placeholder="https://example.com/article" aria-label="Article URL"><button id="submit" type="submit">Read page</button></form>
    <div class="local-tools"><label class="file-button">Add local images<input id="local-images" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple></label><button id="print-board" type="button">Print / Save PDF</button><button id="clear-board" type="button">Clear board</button></div>
    <div class="status" id="status" role="status"></div>
  </header>
  <main>
    <section class="moodboard" id="moodboard" hidden><div class="moodboard-head"><input id="board-title" value="Untitled moodboard" aria-label="Moodboard title"></div><div class="mood-grid" id="mood-grid"></div></section>
    <article id="article" hidden><h2 id="title"></h2><div class="meta" id="meta"></div><div class="tools"><button type="button" data-format="markdown">Download Markdown</button><button type="button" data-format="text">Download text</button></div><div class="download-panel" id="download-panel" hidden><div id="download-message"></div><label><input id="rights" type="checkbox"> I confirm I have permission to download the selected images.</label><button id="download-images" type="button" disabled>Download selected (0/10)</button></div><div id="content"></div></article>
  </main>
  <script>
    const form=document.querySelector('#reader-form'),status=document.querySelector('#status'),article=document.querySelector('#article'),submit=document.querySelector('#submit'),downloadPanel=document.querySelector('#download-panel'),downloadButton=document.querySelector('#download-images'),rights=document.querySelector('#rights'),moodboard=document.querySelector('#moodboard'),moodGrid=document.querySelector('#mood-grid');let result=null;const localUrls=new Set();
    form.addEventListener('submit',async event=>{event.preventDefault();article.hidden=true;submit.disabled=true;status.textContent='Fetching and cleaning the page…';try{const response=await fetch('/api/read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:document.querySelector('#url').value})});const data=await response.json();if(!response.ok)throw new Error(data.detail||'Could not read that page.');result=data;document.querySelector('#title').textContent=data.title;const source=data.byline?`By ${data.byline}`:new URL(data.url).hostname;document.querySelector('#meta').textContent=`${source}${data.image_count?` · ${data.image_count} images`:''}`;document.querySelector('#content').innerHTML=data.html;setupImageSelection(data);article.hidden=false;status.textContent=''}catch(error){status.textContent=error.message}finally{submit.disabled=false}});
    function selectedImages(){return[...document.querySelectorAll('.image-select:checked')].map(box=>box.dataset.url)}function updateDownloadButton(){const count=selectedImages().length;downloadButton.textContent=`Download selected (${count}/10)`;downloadButton.disabled=!rights.checked||count===0||count>10}
    function setupImageSelection(data){downloadPanel.hidden=data.content_type!=='gallery';rights.checked=false;document.querySelector('#download-message').textContent=data.downloads_allowed?'Select up to 10 images from this authorized source.':'Image downloads are disabled for this source. The gallery remains view-only.';rights.disabled=!data.downloads_allowed;document.querySelectorAll('.image-gallery img').forEach(image=>{if(!data.downloads_allowed)return;const checkbox=Object.assign(document.createElement('input'),{type:'checkbox',className:'image-select'});checkbox.dataset.url=image.src;checkbox.setAttribute('aria-label',`Select ${image.alt||'image'}`);checkbox.addEventListener('change',()=>{if(selectedImages().length>10)checkbox.checked=false;updateDownloadButton()});image.closest('.gallery-item')?.prepend(checkbox)});updateDownloadButton()}
    rights.addEventListener('change',updateDownloadButton);downloadButton.addEventListener('click',async()=>{downloadButton.disabled=true;status.textContent='Preparing ZIP…';try{const response=await fetch('/api/download-images',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({urls:selectedImages(),title:result.title,rights_confirmed:rights.checked})});if(!response.ok){const data=await response.json();throw new Error(data.detail||'Download failed.')}const blob=await response.blob(),link=Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:`${result.title.replace(/[^a-z0-9]+/gi,'-').toLowerCase()||'images'}.zip`});link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);status.textContent=''}catch(error){status.textContent=error.message}finally{updateDownloadButton()}});
    document.querySelector('.tools').addEventListener('click',event=>{const format=event.target.dataset.format;if(!format||!result)return;const contents=format==='markdown'?`# ${result.title}\n\nSource: ${result.url}\n\n${result.markdown}`:`${result.title}\n${result.url}\n\n${result.text}`,blob=new Blob([contents],{type:'text/plain;charset=utf-8'}),link=Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:`${result.title.replace(/[^a-z0-9]+/gi,'-').toLowerCase()||'article'}.${format==='markdown'?'md':'txt'}`});link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)});
    document.querySelector('#local-images').addEventListener('change',event=>{[...event.target.files].forEach(file=>{if(!['image/jpeg','image/png','image/webp','image/gif'].includes(file.type)||file.size>15*1024*1024)return;const objectUrl=URL.createObjectURL(file);localUrls.add(objectUrl);const card=document.createElement('div');card.className='mood-card';const image=document.createElement('img');image.src=objectUrl;image.alt=file.name;const fields=document.createElement('div');fields.className='mood-fields';const tags=document.createElement('input');tags.placeholder='Tags: lighting, wide shot…';tags.setAttribute('aria-label','Image tags');const notes=document.createElement('textarea');notes.placeholder='Notes about framing, color, or mood…';notes.setAttribute('aria-label','Image notes');const remove=document.createElement('button');remove.type='button';remove.className='remove-image';remove.textContent='Remove';remove.addEventListener('click',()=>{URL.revokeObjectURL(objectUrl);localUrls.delete(objectUrl);card.remove();moodboard.hidden=moodGrid.children.length===0});fields.append(tags,notes,remove);card.append(image,fields);moodGrid.append(card)});moodboard.hidden=moodGrid.children.length===0;event.target.value=''});
    document.querySelector('#print-board').addEventListener('click',()=>{if(!moodGrid.children.length){status.textContent='Add local images before printing a moodboard.';return}status.textContent='';window.print()});document.querySelector('#clear-board').addEventListener('click',()=>{localUrls.forEach(url=>URL.revokeObjectURL(url));localUrls.clear();moodGrid.replaceChildren();moodboard.hidden=true});
  </script>
</body>
</html>
